[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tsurugi-dev"
version = "0.5.0"
description = "Development wrapper around project-tsurugi/tsurugidb's upstream installer"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
  {name = "Tsurugi development helper"}
]
dependencies = []

[project.scripts]
tsurugi-dev = "tsurugi_dev.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
