[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tsurugi-dev"
version = "0.3.0"
description = "Tsurugi development CLI with reusable build, Git, and system helpers"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
  {name = "Tsurugi development helper"}
]
dependencies = []

[project.scripts]
tsurugi-dev = "tsurugi_dev.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
